# OpenTelemetry Collector -> ZenAi4 intake (example).
#
# Agents instrumented with the OpenTelemetry GenAI semantic conventions send
# OTLP to this collector; it batches, drops what ZenAi4 must never see, and
# forwards traces to POST /v1/intake/otlp with a per-source token.
#
# Environment:
#   ZENAI4_INTAKE_URL    https://<ZENAI4_HOSTNAME>   (the Caddy TLS front, never the gateway port)
#   ZENAI4_SOURCE_TOKEN  zsrc.<id>.<secret>  from `zenai4-admin source add` (shown once)
#
# Delivery guarantees: the sending queue is file-backed (file_storage), so
# batches survive a collector restart; failed exports retry with exponential
# backoff for up to 30 minutes; ZenAi4 deduplicates re-sent spans by span id,
# so a retry after a timeout cannot double-count. Anything still failing after
# max_elapsed_time is dropped AND counted in the collector's own metrics
# (otelcol_exporter_send_failed_spans) - alert on that metric.

extensions:
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    create_directory: true
    timeout: 10s
    compaction:
      on_start: true
      on_rebound: true
      directory: /var/lib/otelcol/queue
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  # Defence in depth: drop credentials before they leave the host. ZenAi4
  # redacts again on arrival; the collector never needs these values.
  attributes/drop-secrets:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.request.header.x-api-key, action: delete }
      - { key: gen_ai.request.api_key, action: delete }
  # ZenAi4 limits a batch to 1000 spans and 1 MiB by default; stay under both.
  batch:
    send_batch_size: 500
    send_batch_max_size: 900
    timeout: 5s

exporters:
  otlphttp/zenai4:
    traces_endpoint: ${env:ZENAI4_INTAKE_URL}/v1/intake/otlp
    encoding: json            # ZenAi4 accepts OTLP/HTTP JSON (protobuf is not supported yet)
    compression: gzip
    headers:
      Authorization: Bearer ${env:ZENAI4_SOURCE_TOKEN}
    tls:
      # With `tls internal` in the Caddyfile, mount Caddy's root CA here
      # (docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt certs/caddy-root.crt).
      ca_file: /certs/caddy-root.crt
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 30m
    sending_queue:
      enabled: true
      storage: file_storage/queue
      num_consumers: 2
      queue_size: 5000

service:
  extensions: [file_storage/queue, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop-secrets, batch]
      exporters: [otlphttp/zenai4]
  telemetry:
    metrics:
      level: normal
